<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Hóspede</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="logo">
      <img
        src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png"
        alt="Logo SETECEB"
      >
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>
  </header>

  <main class="main">

    <h1>Cadastro de Hóspede</h1>
    <p class="subtitle">Cadastre o responsável, acompanhantes e dados da hospedagem</p>

    <section class="form-card">
      <form>

        <div class="form-group">
          <label>Nome do responsável</label>
          <input id="nomeResponsavel" type="text" placeholder="Digite o nome do responsável pela reserva">
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input id="telefone" type="text" placeholder="(00) 00000-0000">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data de Entrada</label>
            <input id="entrada" type="date">
          </div>

          <div class="form-group">
            <label>Data de Saída</label>
            <input id="saida" type="date">
          </div>
        </div>

        <div class="form-group">
          <label>Seleção de Quarto</label>

          <select id="quarto">
            <option value="">Selecione um quarto</option>
            <option>Apartamento 104</option>
            <option>Apartamento 105</option>
            <option>Apartamento 106</option>
            <option>Suíte 1</option>
            <option>Suíte 2</option>
            <option>Suíte 3</option>
          </select>
        </div>

        <div class="form-group">
          <label>Quantidade de acompanhantes</label>

          <input
            type="number"
            id="quantidadeAcompanhantes"
            min="0"
            max="5"
            placeholder="Digite a quantidade de acompanhantes"
            oninput="criarCamposAcompanhantes()"
          >

          <small>O total máximo sugerido é 6 pessoas por hospedagem, contando o responsável.</small>
        </div>

        <div id="camposAcompanhantes"></div>

        <div class="form-buttons">
          <button type="button" class="btn primary" onclick="salvarCadastro()">
            Salvar Cadastro
          </button>

          <button type="reset" class="btn secondary" onclick="limparAcompanhantes()">
            Cancelar
          </button>
        </div>

        <p id="mensagem" class="mensagem"></p>

      </form>
    </section>

  </main>

  <script>
    function criarCamposAcompanhantes() {
      const quantidade = Number(document.getElementById("quantidadeAcompanhantes").value);
      const container = document.getElementById("camposAcompanhantes");

      container.innerHTML = "";

      for (let i = 1; i <= quantidade; i++) {
        container.innerHTML += `
          <div class="form-group">
            <label>Nome do acompanhante ${i}</label>
            <input
              type="text"
              class="acompanhante"
              placeholder="Digite o nome do acompanhante ${i}"
            >
          </div>
        `;
      }
    }

    function limparAcompanhantes() {
      document.getElementById("camposAcompanhantes").innerHTML = "";
      document.getElementById("mensagem").innerHTML = "";
    }

    function salvarCadastro() {
      const nome = document.getElementById("nomeResponsavel").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const entrada = document.getElementById("entrada").value;
      const saida = document.getElementById("saida").value;
      const quarto = document.getElementById("quarto").value;

      const acompanhantesInputs = document.querySelectorAll(".acompanhante");
      const acompanhantes = [];

      acompanhantesInputs.forEach(input => {
        if (input.value.trim() !== "") {
          acompanhantes.push(input.value.trim());
        }
      });

      const totalHospedes = 1 + acompanhantes.length;

      if (nome === "" || telefone === "" || entrada === "" || saida === "" || quarto === "") {
        document.getElementById("mensagem").innerHTML =
          "Preencha todos os dados principais antes de salvar.";
        return;
      }

      if (totalHospedes > 6) {
        document.getElementById("mensagem").innerHTML =
          "O limite máximo é de 6 hóspedes por hospedagem.";
        return;
      }

      const cadastro = {
        responsavel: nome,
        telefone: telefone,
        entrada: entrada,
        saida: saida,
        quarto: quarto,
        acompanhantes: acompanhantes,
        totalHospedes: totalHospedes
      };

      let cadastros = JSON.parse(localStorage.getItem("cadastros")) || [];

      cadastros.push(cadastro);

      localStorage.setItem("cadastros", JSON.stringify(cadastros));

      document.getElementById("mensagem").innerHTML =
        `Cadastro salvo com sucesso! Total de hóspedes: ${totalHospedes}`;
    }
  </script>

</body>
</html>
