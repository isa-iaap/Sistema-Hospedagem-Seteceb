<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Hóspede</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>👥</text></svg>">
</head>

<body>

  <header class="topo">
    <div class="logo">
      <img
        src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png"
        alt="Logo SETECEB">
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>
  </header>

  <main class="main">

    <h1>Cadastro de Hóspede</h1>
    <p class="subtitle">Cadastre o responsável e os dados da hospedagem</p>

    <section class="form-card">

      <form id="formCadastro">

        <div class="form-group">
          <label for="nomeResponsavel">Nome do responsável</label>
          <input id="nomeResponsavel" type="text" placeholder="Digite o nome do responsável" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input id="telefone" type="text" placeholder="(62) 99999-9999" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="entrada">Data de Entrada</label>
            <input id="entrada" type="date">
          </div>

          <div class="form-group">
            <label for="saida">Data de Saída</label>
            <input id="saida" type="date">
          </div>
        </div>

        <div class="form-group">
          <label for="pagamento">Status do pagamento</label>

          <select id="pagamento">
            <option value="">Selecione o status do pagamento</option>
            <option value="Pendente">Pendente</option>
            <option value="Confirmado">Confirmado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quarto">Seleção de Quarto</label>

          <select id="quarto">
            <option value="">Selecione um quarto</option>
            <option>Apartamento 104</option>
            <option>Apartamento 105</option>
            <option>Apartamento 106</option>
            <option>Suíte 1</option>
            <option>Suíte 2</option>
            <option>Suíte 3</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="quantidadeAdultos">Quantidade de adultos</label>
            <input type="number" id="quantidadeAdultos" min="1" max="6" value="1">
          </div>

          <div class="form-group">
            <label for="quantidadeCriancas">Crianças até 12 anos</label>
            <input type="number" id="quantidadeCriancas" min="0" max="6" value="0">
          </div>
        </div>

        <div class="form-buttons">
          <button type="button" class="btn primary" onclick="salvarCadastro()">
            Salvar Cadastro
          </button>

          <button type="reset" class="btn secondary" onclick="limparMensagem()">
            Cancelar
          </button>
        </div>

        <p id="mensagem" class="mensagem"></p>

      </form>

    </section>

  </main>

  <script>
    function mostrarMensagem(texto) {
      document.getElementById("mensagem").innerHTML = texto;
    }

    function limparMensagem() {
      document.getElementById("mensagem").innerHTML = "";
    }
    
   const hoje = new Date().toISOString().split("T")[0];
     document.getElementById("entrada").setAttribute("min", hoje);
     document.getElementById("saida").setAttribute("min", hoje); 
    
    function salvarCadastro() {
      const nome = document.getElementById("nomeResponsavel").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const entrada = document.getElementById("entrada").value;
      const saida = document.getElementById("saida").value;
      const quarto = document.getElementById("quarto").value;
      const pagamento = document.getElementById("pagamento").value;

      const adultos = Number(document.getElementById("quantidadeAdultos").value);
      const criancas = Number(document.getElementById("quantidadeCriancas").value);
      const totalHospedes = adultos + criancas;

      const nomeValido = /^[A-Za-zÀ-ÿ\s]{3,}$/.test(nome);
      const telefoneValido = /^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$/.test(telefone);

      if (!nomeValido) {
        mostrarMensagem("Digite um nome válido com pelo menos 3 letras. Não use números.");
        return;
      }

      if (!telefoneValido) {
        mostrarMensagem("Digite um telefone válido. Exemplo: (62) 99999-9999.");
        return;
      }

      if (entrada === "" || saida === "") {
        mostrarMensagem("Informe a data de entrada e a data de saída.");
        return;
      }

      if (pagamento === "") {
        mostrarMensagem("Selecione o status do pagamento.");
        return;
      }

      if (quarto === "") {
        mostrarMensagem("Selecione um quarto.");
        return;
      }

      if (!Number.isInteger(adultos) || adultos < 1 || adultos > 6) {
        mostrarMensagem("A quantidade de adultos deve ser entre 1 e 6.");
        return;
      }

      if (!Number.isInteger(criancas) || criancas < 0 || criancas > 6) {
        mostrarMensagem("A quantidade de crianças deve ser entre 0 e 6.");
        return;
      }

      if (totalHospedes > 6) {
        mostrarMensagem("O limite máximo é de 6 hóspedes por quarto.");
        return;
      }

      const dataEntrada = new Date(entrada);
      const dataSaida = new Date(saida);

      const quantidadeDiarias = (dataSaida - dataEntrada) / (1000 * 60 * 60 * 24);

      if (quantidadeDiarias <= 0) {
        mostrarMensagem("A data de saída precisa ser depois da data de entrada.");
        return;
      }

      let valorDiaria = 0;

      if (totalHospedes === 1) {
        valorDiaria = 120;
      } else if (totalHospedes === 2) {
        valorDiaria = 174;
      } else if (totalHospedes === 3) {
        valorDiaria = 230;
      } else if (totalHospedes === 4) {
        valorDiaria = 280;
      } else {
        valorDiaria = 336;
      }

      let cadastros = JSON.parse(localStorage.getItem("cadastros")) || [];

      const conflito = cadastros.some(reserva => {
        if (reserva.quarto !== quarto) {
          return false;
        }

        const entradaExistente = new Date(reserva.entrada);
        const saidaExistente = new Date(reserva.saida);

        return dataEntrada < saidaExistente && dataSaida > entradaExistente;
      });

      if (conflito) {
        mostrarMensagem("Este quarto já está reservado nesse período.");
        return;
      }

      const valorTotal = valorDiaria * quantidadeDiarias;

      const cadastro = {
        responsavel: nome,
        telefone: telefone,
        entrada: entrada,
        saida: saida,
        quarto: quarto,
        pagamento: pagamento,
        adultos: adultos,
        criancas: criancas,
        totalHospedes: totalHospedes,
        quantidadeDiarias: quantidadeDiarias,
        valorDiaria: valorDiaria.toFixed(2).replace(".", ","),
        valorTotal: valorTotal.toFixed(2).replace(".", ","),
        dataCadastro: new Date().toLocaleDateString("pt-BR"),
      };

      cadastros.push(cadastro);

      localStorage.setItem("cadastros", JSON.stringify(cadastros));

      document.getElementById("formCadastro").reset();

      mostrarMensagem(
        `Cadastro salvo com sucesso! Total de hóspedes: ${totalHospedes}. Valor total: R$ ${cadastro.valorTotal}`
      );
    }
  </script>

</body>
</html>
