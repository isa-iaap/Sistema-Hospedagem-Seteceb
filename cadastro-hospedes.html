<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Hóspede</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="logo">
      <img
        src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png"
        alt="Logo SETECEB"
      >
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>
  </header>

  <main class="main">

    <h1>Cadastro de Hóspede</h1>
    <p class="subtitle">Preencha os dados do hóspede e selecione o quarto</p>

    <section class="form-card">
      <form>

        <div class="form-group">
  <label>Nome Completo</label>
  <input type="text" placeholder="Digite o nome completo do hóspede">
</div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="text" placeholder="(00) 00000-0000">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data de Entrada</label>
            <input type="date">
          </div>

          <div class="form-group">
            <label>Data de Saída</label>
            <input type="date">
          </div>
        </div>

        <div class="form-group">
          <label>Seleção de Quarto</label>
          <select>
            <option>Selecione um quarto</option>
            <option>Quarto 01 - Disponível</option>
            <option>Quarto 02 - Disponível</option>
            <option>Quarto 03 - Reservado</option>
          </select>
        </div>

        <div class="form-group">
  <label>Quantidade de acompanhantes</label>

  <input
    type="number"
    id="quantidadeAcompanhantes"
    min="0"
    placeholder="Digite a quantidade"
    onchange="criarCamposAcompanhantes()"
  >
</div>

<div id="camposAcompanhantes"></div>

        <div class="form-buttons">
          <button type="button" class="btn primary" onclick="salvarCadastro()">
            Salvar Cadastro
          </button>

          <button type="reset" class="btn secondary">
            Cancelar
          </button>
        </div>

        <p id="mensagem" class="mensagem"></p>

      </form>
    </section>

  </main>

  <script>
  function criarCamposAcompanhantes() {
    const quantidade = Number(document.getElementById("quantidadeAcompanhantes").value);
    const container = document.getElementById("camposAcompanhantes");

    container.innerHTML = "";

    for (let i = 1; i <= quantidade; i++) {
      container.innerHTML += `
        <div class="form-group">
          <label>Acompanhante ${i}</label>
          <input
            type="text"
            class="acompanhante"
            placeholder="Digite o nome do acompanhante ${i}"
          >
        </div>
      `;
    }
  }

  function salvarCadastro() {
    const nome = document.querySelector('input[placeholder="Digite o nome completo do hóspede"]').value;
    const telefone = document.querySelector('input[placeholder="(00) 00000-0000"]').value;
    const entrada = document.querySelectorAll('input[type="date"]')[0].value;
    const saida = document.querySelectorAll('input[type="date"]')[1].value;
    const quarto = document.querySelector("select").value;

    const acompanhantesInputs = document.querySelectorAll(".acompanhante");
    const acompanhantes = [];

    acompanhantesInputs.forEach(input => {
      if (input.value.trim() !== "") {
        acompanhantes.push(input.value.trim());
      }
    });

    const totalHospedes = 1 + acompanhantes.length;

    const cadastro = {
      responsavel: nome,
      telefone: telefone,
      entrada: entrada,
      saida: saida,
      quarto: quarto,
      acompanhantes: acompanhantes,
      totalHospedes: totalHospedes
    };

    let cadastros = JSON.parse(localStorage.getItem("cadastros")) || [];

    cadastros.push(cadastro);

    localStorage.setItem("cadastros", JSON.stringify(cadastros));

    document.getElementById("mensagem").innerHTML =
      `Cadastro salvo com sucesso! Total de hóspedes: ${totalHospedes}`;
  }
</script>

</body>
</html>
