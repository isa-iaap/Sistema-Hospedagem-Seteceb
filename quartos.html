<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🛏️</text></svg>">
</head>

<body>

  <header class="topo">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png" alt="Logo SETECEB">
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>
  </header>

  <main class="main">

    <h1>Quartos</h1>
    <p class="subtitle">Visão geral dos quartos e disponibilidade</p>

    <section class="quartos-resumo">
      <div class="resumo-card">
        <span>✓</span>
        <div>
          <p>Disponíveis</p>
          <strong id="quartosDisponiveis">0</strong>
        </div>
      </div>

      <div class="resumo-card">
        <span>◷</span>
        <div>
          <p>Reservados</p>
          <strong id="quartosReservados">0</strong>
        </div>
      </div>

      <div class="resumo-card">
        <span>×</span>
        <div>
          <p>Ocupados</p>
          <strong id="quartosOcupados">0</strong>
        </div>
      </div>
    </section>

    <section class="quartos-lista" id="listaQuartos"></section>

  </main>

  <script>
    const quartos = [
      { nome: "Apartamento 104", capacidade: "até 6 pessoas", tipo: "Apartamento" },
      { nome: "Apartamento 105", capacidade: "até 6 pessoas", tipo: "Apartamento" },
      { nome: "Apartamento 106", capacidade: "até 6 pessoas", tipo: "Apartamento" },
      { nome: "Suíte 1", capacidade: "até 4 pessoas", tipo: "Suíte" },
      { nome: "Suíte 2", capacidade: "até 4 pessoas", tipo: "Suíte" },
      { nome: "Suíte 3", capacidade: "até 4 pessoas", tipo: "Suíte" }
    ];

    function carregarQuartos() {
      const reservas = JSON.parse(localStorage.getItem("cadastros")) || [];
      const lista = document.getElementById("listaQuartos");

      lista.innerHTML = "";

      let ocupados = 0;

      quartos.forEach(quarto => {
        const reserva = reservas.find(item => item.quarto === quarto.nome);
        const estaOcupado = reserva !== undefined;

        if (estaOcupado) {
          ocupados++;
        }

        lista.innerHTML += `
          <div class="quarto-box ${estaOcupado ? "quarto-ocupado" : "quarto-disponivel"}">
            <h2>${quarto.nome}</h2>
            <p>Capacidade: ${quarto.capacidade}</p>
            <p>Tipo: ${quarto.tipo}</p>
            <hr>
            <p>Status: <strong>${estaOcupado ? "Ocupado" : "Disponível"}</strong></p>
            ${estaOcupado ? `<p>Responsável: ${reserva.responsavel}</p>` : ""}
          </div>
        `;
      });

      document.getElementById("quartosDisponiveis").innerText = quartos.length - ocupados;
      document.getElementById("quartosReservados").innerText = ocupados;
      document.getElementById("quartosOcupados").innerText = ocupados;
    }

    carregarQuartos();
  </script>

</body>
</html>
