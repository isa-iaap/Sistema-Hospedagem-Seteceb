<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Hospedagem SETECEB</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="logo">
      <img
        src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png"
        alt="Logo SETECEB"
      >
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>
  </header>

  <div class="layout">
    <main class="main">

      <h1>Painel de Controle</h1>
      <p class="subtitle">Visão geral do sistema de hospedagem</p>

      <section class="grid">

        <div class="card">
          <div>
            <p>Total de Hóspedes</p>
            <strong>0</strong>
          </div>

          <span class="icon black">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </span>
        </div>

        <div class="card">
          <div>
            <p>Quartos Disponíveis</p>
            <strong>10</strong>
          </div>

          <span class="icon black">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path>
              <path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"></path>
              <path d="M12 4v6"></path>
              <path d="M2 18h20"></path>
            </svg>
          </span>
        </div>

        <div class="card">
          <div>
            <p>Quartos Ocupados</p>
            <strong>0</strong>
          </div>

          <span class="icon black">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
              <path d="m9 11 3 3L22 4"></path>
            </svg>
          </span>
        </div>

        <div class="card">
          <div>
            <p>Reservas Ativas</p>
            <strong>0</strong>
          </div>

          <span class="icon black">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
          </span>
        </div>

      </section>

      <section class="bottom">

        <div class="panel">
          <h2>Ações Rápidas</h2>

          <a class="btn primary" href="cadastro-hospedes.html">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </span>
            Cadastrar Novo Hóspede
          </a>

          <a class="btn secondary" href="quartos.html">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path>
                <path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"></path>
                <path d="M12 4v6"></path>
                <path d="M2 18h20"></path>
              </svg>
            </span>
            Ver Quartos Disponíveis
          </a>
        </div>

        <div class="panel">
          <h2>Últimas Reservas</h2>
          <p>Nenhuma reserva cadastrada ainda</p>
        </div>

      </section>

    </main>
  </div>

</body>
</html>
