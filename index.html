<script>
  function atualizarDashboard() {
    const cadastros = JSON.parse(localStorage.getItem("cadastros")) || [];
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    const totalQuartos = 6;

    const reservasAtivasLista = cadastros.filter(cadastro => {
      const entrada = new Date(cadastro.entrada + "T00:00:00");
      const saida = new Date(cadastro.saida + "T00:00:00");

      return hoje >= entrada && hoje < saida;
    });

    let totalHospedes = 0;

    reservasAtivasLista.forEach(cadastro => {
      totalHospedes += Number(cadastro.totalHospedes) || 0;
    });

    const quartosOcupados = new Set(
      reservasAtivasLista.map(cadastro => cadastro.quarto)
    ).size;

    const quartosDisponiveis = totalQuartos - quartosOcupados;
    const reservasAtivas = reservasAtivasLista.length;

    document.getElementById("totalHospedes").innerText = totalHospedes;
    document.getElementById("quartosDisponiveis").innerText = quartosDisponiveis;
    document.getElementById("quartosOcupados").innerText = quartosOcupados;
    document.getElementById("reservasAtivas").innerText = reservasAtivas;

    const ultimasReservas = document.getElementById("ultimasReservas");

    if (cadastros.length === 0) {
      ultimasReservas.innerHTML = "<p>Nenhuma reserva cadastrada ainda</p>";
    } else {
      const ultimas = cadastros.slice(-3).reverse();

      ultimasReservas.innerHTML = "";

      ultimas.forEach(reserva => {
        ultimasReservas.innerHTML += `
          <p>
            <strong>${reserva.responsavel}</strong><br>
            ${reserva.quarto} - ${reserva.totalHospedes} hóspede(s)<br>
            Entrada: ${reserva.entrada} | Saída: ${reserva.saida}<br>
            Pagamento: ${reserva.pagamento || "Não informado"}
          </p>
        `;
      });
    }
  }

  atualizarDashboard();
</script>
