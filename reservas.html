<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>📅</text></svg>">
</head>

<body>

  <header class="topo">

    <div class="logo">
      <img
        src="https://static.wixstatic.com/media/ba5321_61740a2cd04d47279f1d99a928465122~mv2.png/v1/fill/w_221,h_63,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20SETECEB%20Branca.png"
        alt="Logo SETECEB"
      >
    </div>

    <nav class="menu-topo">
      <a href="index.html">Início</a>
      <a href="cadastro-hospedes.html">Hóspedes</a>
      <a href="reservas.html">Reservas</a>
      <a href="quartos.html">Quartos</a>
    </nav>

  </header>

  <main class="main">

    <h1>Reservas</h1>

    <p class="subtitle">
      Gerenciamento de reservas e hóspedes hospedados
    </p>

    <section class="reservas-area">

      <div class="topo-reservas">

        <div class="resumo-reservas">
          <strong>
            Reservas Ativas:
            <span id="totalReservas">0</span>
          </strong>
        </div>

        <a
          class="btn primary"
          href="cadastro-hospedes.html"
        >
          Nova Reserva
        </a>

      </div>

      <div id="listaReservas"></div>

    </section>

  </main>

  <script>

    function carregarReservas() {

      const reservas =
        JSON.parse(localStorage.getItem("cadastros")) || [];

      const lista =
        document.getElementById("listaReservas");

      lista.innerHTML = "";

      document.getElementById("totalReservas").innerText =
        reservas.length;

      if (reservas.length === 0) {

        lista.innerHTML = `

          <div class="sem-reservas">
            Nenhuma reserva cadastrada ainda
          </div>

        `;

        return;
      }

      reservas.forEach((reserva, index) => {

        lista.innerHTML += `

          <div class="reserva-card">

            <div class="reserva-info">

              <div class="reserva-header">

                <h2>
                  ${reserva.responsavel}
                </h2>

                <span class="status-reserva">
                  Reservado
                </span>

              </div>

              <div class="reserva-grid">

                <div>
                  <small>Telefone</small>
                  <p>${reserva.telefone}</p>
                </div>

                <div>
                  <small>Quarto</small>
                  <p>${reserva.quarto}</p>
                </div>

                <div>
  <small>Pagamento</small>
  <p>${reserva.pagamento || "Não informado"}</p>
</div>

                <div>
                  <small>Check-in</small>
                  <p>${reserva.entrada}</p>
                </div>

                <div>
                  <small>Check-out</small>
                  <p>${reserva.saida}</p>
                </div>

                <div>
                  <small>Adultos</small>
                  <p>${reserva.adultos || 0}</p>
                </div>

                <div>
                  <small>Crianças</small>
                  <p>${reserva.criancas || 0}</p>
                </div>

                <div>
                  <small>Total de hóspedes</small>
                  <p>${reserva.totalHospedes || 0}</p>
                </div>
                
                <div>
  <small>Diárias</small>
  <p>${reserva.quantidadeDiarias || 0}</p>
</div>

<div>
  <small>Valor da diária</small>
  <p>R$ ${reserva.valorDiaria || "0,00"}</p>
</div>

                <div>
                  <small>Valor total</small>
                  <p>
                    <strong>
                      R$ ${reserva.valorTotal || "0,00"}
                    </strong>
                  </p>
                </div>

              </div>

            </div>

            <button
              onclick="excluirReserva(${index})"
              class="btn-excluir"
            >
              Excluir Reserva
            </button>

          </div>

        `;
      });
    }

    function excluirReserva(index) {

      let reservas =
        JSON.parse(localStorage.getItem("cadastros")) || [];

      reservas.splice(index, 1);

      localStorage.setItem(
        "cadastros",
        JSON.stringify(reservas)
      );

      carregarReservas();
    }

    carregarReservas();

  </script>

</body>
</html> 
</body>
</html>
